<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">
  <style>
    .role{fill:#f6f8fc;stroke:#0b1b3f;stroke-width:2}
    .rt{font-size:17px;font-weight:800;fill:#0b1b3f}
    .th{stroke:#0b1b3f;stroke-width:2.2}
    .act{fill:#0b1b3f}
    .int{fill:#fff;stroke:#0b1b3f;stroke-width:2}
    .il{stroke:#2f5bea;stroke-width:2}
    .lbl{fill:#0f172a}
    .cond{fill:#b45309;font-size:13px;font-style:italic}
    .tri{fill:#fff;stroke:#0b1b3f;stroke-width:2}
  </style>
  <rect width="1180" height="900" fill="#fff"/>

  <!-- Роли -->
  <rect class="role" x="20" y="20" width="370" height="860" rx="26"/>
  <rect class="role" x="405" y="20" width="370" height="860" rx="26"/>
  <rect class="role" x="790" y="20" width="370" height="860" rx="26"/>
  <text class="rt" x="205" y="55" text-anchor="middle">Клиент</text>
  <text class="rt" x="590" y="55" text-anchor="middle">Менеджер по логистике</text>
  <text class="rt" x="975" y="55" text-anchor="middle">Склад</text>

  <!-- Клиент: нить -->
  <line class="th" x1="120" y1="80" x2="120" y2="120"/>
  <rect class="act" x="110" y="120" width="20" height="20"/><text class="lbl" x="140" y="135">Оформить заявку</text>
  <line class="th" x1="120" y1="140" x2="120" y2="190"/>
  <!-- взаимодействие 1: передать заявку -->
  <rect class="int" x="110" y="190" width="20" height="20"/>
  <line class="il" x1="130" y1="200" x2="490" y2="200"/>
  <text class="lbl" x="140" y="185">Передать заявку</text>
  <line class="th" x1="120" y1="210" x2="120" y2="380"/>

  <!-- Менеджер -->
  <line class="th" x1="500" y1="80" x2="500" y2="190"/>
  <rect class="int" x="490" y="190" width="20" height="20"/>
  <line class="th" x1="500" y1="210" x2="500" y2="250"/>
  <rect class="act" x="490" y="250" width="20" height="20"/><text class="lbl" x="520" y="265">Проверить заявку</text>
  <line class="th" x1="500" y1="270" x2="500" y2="300"/>
  <!-- case refinement: перевёрнутые треугольники -->
  <polygon class="tri" points="488,300 512,300 500,318"/>
  <line class="th" x1="500" y1="318" x2="500" y2="330"/>
  <line class="th" x1="440" y1="330" x2="640" y2="330"/>
  <polygon class="tri" points="428,330 452,330 440,348"/>
  <polygon class="tri" points="628,330 652,330 640,348"/>
  <text class="cond" x="415" y="368">заявка неполная</text>
  <text class="cond" x="600" y="368">заявка корректна</text>
  <!-- ветка «неполная» -->
  <line class="th" x1="440" y1="348" x2="440" y2="395"/>
  <rect class="int" x="430" y="395" width="20" height="20"/>
  <line class="il" x1="130" y1="405" x2="430" y2="405"/>
  <text class="lbl" x="140" y="425">Получить запрос уточнения</text>
  <text class="lbl" x="456" y="430" font-size="13">Запросить уточнение</text>
  <path d="M440 415 V 445" class="th"/>
  <text class="lbl" x="415" y="465" font-size="12" fill="#64748b">↺ к проверке</text>
  <!-- клиент получает -->
  <rect class="int" x="110" y="395" width="20" height="20"/>
  <line class="th" x1="120" y1="380" x2="120" y2="395"/>
  <line class="th" x1="120" y1="415" x2="120" y2="560"/>
  <!-- ветка «корректна» -->
  <line class="th" x1="640" y1="348" x2="640" y2="400"/>
  <rect class="act" x="630" y="400" width="20" height="20"/><text class="lbl" x="660" y="415">Рассчитать</text><text class="lbl" x="660" y="432">стоимость</text>
  <line class="th" x1="640" y1="420" x2="640" y2="470"/>
  <rect class="act" x="630" y="470" width="20" height="20"/><text class="lbl" x="660" y="485">Сформировать</text><text class="lbl" x="660" y="502">договор-счёт</text>
  <line class="th" x1="640" y1="490" x2="640" y2="560"/>
  <!-- взаимодействие 2: счёт клиенту -->
  <rect class="int" x="630" y="560" width="20" height="20"/>
  <rect class="int" x="110" y="560" width="20" height="20"/>
  <line class="il" x1="130" y1="570" x2="630" y2="570"/>
  <text class="lbl" x="140" y="555">Получить счёт и оплатить</text>
  <line class="th" x1="640" y1="580" x2="640" y2="640"/>
  <line class="th" x1="120" y1="580" x2="120" y2="760"/>

  <!-- взаимодействие 3: заказ на склад -->
  <rect class="int" x="630" y="640" width="20" height="20"/>
  <line class="il" x1="650" y1="650" x2="870" y2="650"/>
  <text class="lbl" x="660" y="685">Передать заказ на склад</text>
  <line class="th" x1="640" y1="660" x2="640" y2="860"/>

  <!-- Склад -->
  <line class="th" x1="880" y1="80" x2="880" y2="640"/>
  <text class="lbl" x="895" y="120" font-size="12" fill="#64748b">ожидание заказа</text>
  <rect class="int" x="870" y="640" width="20" height="20"/>
  <line class="th" x1="880" y1="660" x2="880" y2="690"/>
  <!-- part refinement: треугольник вершиной вверх -->
  <polygon class="tri" points="880,690 868,708 892,708"/>
  <line class="th" x1="880" y1="708" x2="880" y2="716"/>
  <line class="th" x1="840" y1="716" x2="1000" y2="716"/>
  <polygon class="tri" points="840,716 828,734 852,734"/>
  <polygon class="tri" points="1000,716 988,734 1012,734"/>
  <line class="th" x1="840" y1="734" x2="840" y2="760"/>
  <line class="th" x1="1000" y1="734" x2="1000" y2="760"/>
  <rect class="act" x="830" y="760" width="20" height="20"/><text class="lbl" x="815" y="800" font-size="13">Скомплектовать</text>
  <rect class="act" x="990" y="760" width="20" height="20"/><text class="lbl" x="975" y="800" font-size="13">Оформить ТТН</text>

  <!-- клиент: приёмка -->
  <rect class="act" x="110" y="760" width="20" height="20"/><text class="lbl" x="140" y="775">Принять груз</text>
  <line class="th" x1="120" y1="780" x2="120" y2="860"/>

  <!-- Легенда -->
  <g transform="translate(250,835)">
  </g>
</svg>
